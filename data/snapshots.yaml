# 出発時刻のスナップショット。
#
# GitHub Pages（静的ホスティング）に置くため、**到達圏と経路の結果を先に計算して**
# ファイルとして配る。そのため出発時刻は固定になる。
# ここに足して `python3.9 scripts/build_static.py` を流し直すと、
# 画面のプルダウンに選べる形で増える（1 つ増やすと生成物も 1 セット増える）。
#
# 曜日も固定される点に注意（2026-09-24 は木曜日なので平日ダイヤ）。
# 休日ダイヤを見せたいときは、土日の日付でもう 1 つ足す。
- id: weekday-noon
  label: 平日の昼（木曜 10:00 発）
  date: "2026-09-24"
  time: "10:00"
  note: 平日ダイヤ。2026年9月24日（木）の10時に家を出たときの結果です
